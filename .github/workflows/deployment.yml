name: CI Pipeline

on: push

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Node.js dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint
          
      - name: Run test
        run: npm test

      - name: Success Notification Test
        run: echo "🎉 SUCCESS: All automated tests passed beautifully!"

  deploy:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deploying ..."
